<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portico Hub — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;560;590;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background-color: #f7f7f8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #101014;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 380px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, 0.10);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(15, 23, 42, 0.08);
      padding: 32px;
    }

    .wordmark {
      font-size: 1.25rem;
      font-weight: 590;
      line-height: 1.33;
      letter-spacing: -0.24px;
      color: #101014;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 450;
      line-height: 1.4;
      color: #62676f;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 0.875rem;
      color: #101014;
      background-color: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input::placeholder {
      color: #9aa0aa;
    }

    .form-input:focus {
      border-color: #6e5ae6;
      box-shadow: 0 0 0 3px rgba(110, 90, 230, 0.15);
    }

    .helper-text {
      font-size: 12px;
      line-height: 1.4;
      color: #62676f;
      margin-top: 6px;
    }

    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .strength-segment {
      height: 2px;
      flex: 1;
      background-color: rgba(15, 23, 42, 0.10);
      border-radius: 1px;
    }

    .strength-segment.active {
      background-color: #6e5ae6;
    }

    .btn-submit {
      width: 100%;
      height: 40px;
      background-color: #6e5ae6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.813rem;
      font-weight: 560;
      letter-spacing: -0.13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      transition: background-color 0.15s ease;
    }

    .btn-submit:hover {
      background-color: #5b46d6;
    }

    .divider {
      height: 1px;
      background-color: rgba(15, 23, 42, 0.10);
      margin-top: 24px;
      margin-bottom: 16px;
    }

    .footer-text {
      font-size: 12px;
      line-height: 1.5;
      color: #62676f;
      text-align: center;
    }

    .footer-link {
      color: #5b46d6;
      text-decoration: none;
      font-weight: 500;
      margin-left: 4px;
    }

    .footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Portico</div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="nama">Nama</label>
        <input type="text" id="nama" class="form-input" placeholder="Nama lengkap" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="nama@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="new-password">
        <div class="helper-text">Minimal 8 karakter dengan kombinasi huruf dan angka.</div>
        <div class="password-strength" aria-hidden="true">
          <div class="strength-segment"></div>
          <div class="strength-segment"></div>
          <div class="strength-segment"></div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="konfirmasi-password">Konfirmasi password</label>
        <input type="password" id="konfirmasi-password" class="form-input" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit">Buat akun</button>
    </form>

    <div class="divider"></div>

    <div class="footer-text">
      Sudah punya akun?<a href="#" class="footer-link">Masuk</a>
    </div>
  </div>
</body>
</html>
